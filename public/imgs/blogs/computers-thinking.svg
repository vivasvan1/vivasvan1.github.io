<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Center Atmospheric Glow -->
  <circle cx="600" cy="315" r="420" fill="url(#centerGlow)" />

  <!-- Tech Geometric Circuits / Nodes -->
  <g opacity="0.4" stroke="#60a5fa" stroke-width="1.5" fill="none">
    <path d="M 150 150 L 300 150 L 380 230 L 520 230" />
    <circle cx="150" cy="150" r="4" fill="#60a5fa" />
    <circle cx="520" cy="230" r="4" fill="#a78bfa" />

    <path d="M 1050 480 L 900 480 L 820 400 L 680 400" />
    <circle cx="1050" cy="480" r="4" fill="#ec4899" />
    <circle cx="680" cy="400" r="4" fill="#a78bfa" />

    <path d="M 250 500 L 400 500 L 480 420 L 550 420" />
    <circle cx="250" cy="500" r="4" fill="#3b82f6" />

    <path d="M 950 150 L 800 150 L 720 230 L 650 230" />
    <circle cx="950" cy="150" r="4" fill="#8b5cf6" />
  </g>

  <!-- Neural Core Network Diagram -->
  <g transform="translate(600, 270)">
    <!-- Outer concentric dashed rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5" stroke-dasharray="4,6" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2" />

    <!-- Connecting network lines -->
    <g stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2">
      <line x1="-100" y1="-60" x2="0" y2="0" />
      <line x1="100" y1="-60" x2="0" y2="0" />
      <line x1="-80" y1="80" x2="0" y2="0" />
      <line x1="80" y1="80" x2="0" y2="0" />
      <line x1="-130" y1="20" x2="-80" y2="80" />
      <line x1="130" y1="20" x2="80" y2="80" />
      <line x1="-100" y1="-60" x2="0" y2="-120" />
      <line x1="100" y1="-60" x2="0" y2="-120" />
      <line x1="0" y1="-120" x2="0" y2="0" />
    </g>

    <!-- Nodes -->
    <circle cx="0" cy="0" r="18" fill="url(#glow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />

    <circle cx="-100" cy="-60" r="8" fill="#3b82f6" />
    <circle cx="100" cy="-60" r="8" fill="#8b5cf6" />
    <circle cx="-80" cy="80" r="8" fill="#ec4899" />
    <circle cx="80" cy="80" r="8" fill="#3b82f6" />
    <circle cx="0" cy="-120" r="9" fill="#a78bfa" />
    <circle cx="-130" cy="20" r="7" fill="#60a5fa" />
    <circle cx="130" cy="20" r="7" fill="#f472b6" />
  </g>

  <!-- Typography / Code Overlay -->
  <text x="600" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    ARE COMPUTERS REALLY "THINKING"?
  </text>
  <text x="600" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="3">
    AI IN CODING  •  PRODUCTION REALITIES  •  THE LAB HYPE MACHINE
  </text>

  <!-- Terminal pill badge -->
  <g transform="translate(600, 560)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">
      $ tensor.eval() != consciousness
    </text>
  </g>
</svg>
